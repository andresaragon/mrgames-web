name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint is reported but does not fail the build yet: a clean checkout has
      # 20 pre-existing ESLint errors (CommonJS maintenance scripts and React
      # hooks rules). Remove continue-on-error once they are fixed.
      - name: Run lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Run tests
        run: npm test

      # Build is omitted because it may require real environment variables.
